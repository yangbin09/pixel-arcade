# PIXEL ARCADE —— 宿主 nginx 反向代理到 Docker 容器
# 容器监听 127.0.0.1:8080，不直接对外；TLS 仍由宿主 nginx 终止。
server {
    server_name 96-47-231-250.sslip.io _;
    charset utf-8;
    server_tokens off;

    # 容器健康检查直通
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/96-47-231-250.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/96-47-231-250.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 96-47-231-250.sslip.io _;

    if ($host = 96-47-231-250.sslip.io) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
