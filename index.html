<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060c">
  <meta name="color-scheme" content="dark">
  <title>小游戏合集 · PIXEL ARCADE</title>
  <meta name="description" content="像素街机小游戏合集：无需下载，点开就玩。打地鼠、贪吃蛇、打砖块、俄罗斯方块等 10 款，手机触屏和键盘都能玩。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307060c'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23f3a841'/%3E%3Crect x='7' y='2' width='2' height='2' fill='%23ffd35f'/%3E%3Crect x='2' y='9' width='2' height='2' fill='%23a6d96b'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PIXEL ARCADE">
  <script type="module" src="/site/home.ts"></script>
</head>
<body class="page-home">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <a class="skip-link" href="#catalog">跳到游戏列表</a>

  <div class="site">
    <div class="shell">
      <header class="masthead">
        <div class="topline">
          <div class="brand">
            <canvas class="brand-mark" data-icon="joystick" data-icon-size="30" width="11" height="11" aria-hidden="true"></canvas>
            <div class="brand-text">
              <strong>PIXEL ARCADE</strong>
              <span>像素街机 · 小游戏合集</span>
            </div>
          </div>
          <span class="build-tag">BUILD 002</span>
        </div>

        <div class="hero">
          <div class="hero-main">
            <p class="kicker">MINI GAME COLLECTION / VOL. 01</p>
            <h1><span>小游戏</span><span class="accent">合集</span><span class="caret" aria-hidden="true"></span></h1>
            <p class="lede">没有下载，没有广告。一块屏幕，一点手感，随手点开就能玩。手机竖屏优先，键盘也能敲。</p>
          </div>

          <aside class="notice" aria-label="街机厅状态">
            <p class="notice-head">
              <i class="live-dot" aria-hidden="true"></i>营业中
              <span>ARCADE OPEN</span>
            </p>
            <dl class="notice-stats">
              <div><dt>可玩</dt><dd id="statOpen">00</dd></div>
              <div><dt>建设中</dt><dd id="statSoon">10</dd></div>
              <div><dt>单局</dt><dd id="statRound">30<span>s</span></dd></div>
            </dl>
            <p class="notice-foot">竖屏优先 · 触屏 / 键盘</p>
          </aside>
        </div>
      </header>

      <main id="catalog">
        <div class="section-head">
          <h2>全部游戏</h2>
          <p id="catalogCount" aria-label="10 个位置，1 个已开放">00 / 10 OPEN</p>
        </div>

        <ul class="game-grid" id="gameGrid"></ul>
      </main>

      <footer class="site-foot">
        <p>全部游戏都在浏览器里运行，不联网也能玩。最高分只保存在这台设备上。</p>
        <p class="foot-meta">PIXEL ARCADE © 2026<br>NO DOWNLOAD / NO LOGIN</p>
      </footer>
    </div>
  </div>
</body>
</html>
