server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 构建期已生成 .gz，直接发压缩文件
    gzip_static on;

    types {
        application/manifest+json webmanifest;
    }

    # 安全头放在 server 级，location 里不用 add_header，避免覆盖
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "fullscreen=(self), geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 播放壳：/play/?game=xxx，目录索引即可
    location = /play/ {
        expires -1;
        try_files /play/index.html =404;
    }

    # 带 hash 的静态资源，长缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证更新立刻生效
    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
